name: rocketchat-platform
label: Rocket.Chat
kind: platform
version: 0.3.0
description: Rocket.Chat gateway adapter for Hermes Agent
author: hermes-rocketchat-bot
requires_env:
  - name: ROCKETCHAT_SERVER_URL
    description: Rocket.Chat server URL, e.g. https://chat.example.com
    prompt: Rocket.Chat server URL
    password: false
  - name: ROCKETCHAT_AUTH_MODE
    description: "Authentication mode: token or password"
    prompt: Auth mode
    password: false
optional_env:
  - name: ROCKETCHAT_USER_ID
    description: Rocket.Chat user ID for token authentication
    prompt: User ID
    password: false
  - name: ROCKETCHAT_ACCESS_TOKEN
    description: Rocket.Chat access token for token authentication
    prompt: Access token
    password: true
  - name: ROCKETCHAT_USERNAME
    description: Rocket.Chat username for password authentication
    prompt: Username
    password: false
  - name: ROCKETCHAT_PASSWORD
    description: Rocket.Chat password for password authentication
    prompt: Password
    password: true
  - name: ROCKETCHAT_TRANSPORT
    description: polling or websocket
    prompt: Transport
    password: false
  - name: ROCKETCHAT_MENTION_NAMES
    description: Comma-separated aliases that trigger the bot in rooms
    prompt: Mention aliases
    password: false
  - name: ROCKETCHAT_ALWAYS_RESPOND_ROOMS
    description: Comma-separated room IDs where the bot responds to every message without a mention
    prompt: Always-respond room IDs
    password: false
  - name: ROCKETCHAT_IGNORE_OTHER_USER_MENTIONS
    description: Do not respond when the bot is mentioned alongside other users (mass mention)
    prompt: Ignore other-user mentions
    password: false
  - name: ROCKETCHAT_ALLOWED_USERS
    description: Comma-separated Rocket.Chat user IDs allowed to talk to Hermes
    prompt: Allowed users
    password: false
  - name: ROCKETCHAT_ALLOW_ALL_USERS
    description: Allow all Rocket.Chat users
    prompt: Allow all users
    password: false
  - name: ROCKETCHAT_HOME_CHANNEL
    description: Default room ID for cron and proactive delivery
    prompt: Home room ID
    password: false
  - name: ROCKETCHAT_RECEIVE_TIMEOUT
    description: Seconds without a WebSocket frame before sending a heartbeat ping (default 60)
    prompt: Receive timeout seconds
    password: false
  - name: ROCKETCHAT_PING_TIMEOUT
    description: Seconds to wait for a heartbeat ping response before reconnecting (default 10)
    prompt: Ping timeout seconds
    password: false
  - name: ROCKETCHAT_RECONNECT_INITIAL_DELAY
    description: Initial WebSocket reconnect delay in seconds (default 1)
    prompt: Reconnect initial delay
    password: false
  - name: ROCKETCHAT_RECONNECT_MAX_DELAY
    description: Cap for exponential backoff reconnect delay in seconds (default 60)
    prompt: Reconnect max delay
    password: false
  - name: ROCKETCHAT_RECONNECT_MAX_ATTEMPTS
    description: Max reconnect attempts before giving up; 0 means unlimited (default 0)
    prompt: Reconnect max attempts
    password: false
  - name: ROCKETCHAT_RECONNECT_JITTER
    description: Jitter fraction (0-0.5) applied to each reconnect delay (default 0.25)
    prompt: Reconnect jitter
    password: false
  - name: ROCKETCHAT_DEDUP_ENABLED
    description: Suppress replayed inbound messages after WebSocket reconnect (default true)
    prompt: Inbound dedup enabled
    password: false
  - name: ROCKETCHAT_DEDUP_TTL_HOURS
    description: Hours to remember seen message ids for dedup (default 168 = 7 days)
    prompt: Dedup TTL hours
    password: false
  - name: ROCKETCHAT_DEDUP_STORE_PATH
    description: Path to the persistent seen-id store file (default $HERMES_HOME/rocketchat_seen_ids.json)
    prompt: Dedup store path
    password: false
