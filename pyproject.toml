[project]
name = "hermes-rocketchat-bot"
version = "0.1.0"
description = "Rocket.Chat gateway adapter for Hermes Agent"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-asyncio",
    "pyyaml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
